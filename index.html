<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Website</title>
  <link rel="stylesheet" href="style.css">
  <!-- Open Graph meta tags for social media sharing -->
  <meta property="og:title" content="Breaking News Today">
  <meta property="og:description" content="Your daily source of news updates.">
  <meta property="og:image" content="image_link_here">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Breaking News Today</h1>
    <p>Your daily source of news updates</p>
  </header>

  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="#" id="home">Home</a></li>
      <li><a href="#" id="politics">Politics</a></li>
      <li><a href="#" id="sports">Sports</a></li>
      <li><a href="#" id="entertainment">Entertainment</a></li>
      <li><a href="#" id="technology">Technology</a></li>
    </ul>
  </nav>

  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search for news..." />
    <button id="searchButton">Search</button>
  </div>

  <!-- Dark Mode Toggle -->
  <button id="darkModeButton">Toggle Dark Mode</button>

  <!-- Loading Spinner -->
  <div class="loading" style="display: none;">Loading...</div>

  <!-- Articles Section (Dynamic Content) -->
  <section class="articles">
    <!-- News articles will be inserted here by JavaScript -->
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 News Website. All Rights Reserved.</p>
    <p>Follow us on <a href="#">Facebook</a>, <a href="#">Twitter</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
